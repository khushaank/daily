name: Android APK

# Manual only while source edits are in progress. Existing APKs stay untouched.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" "platforms;android-36" "build-tools;35.0.0"
      - name: Build installable APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: my-daily-brief-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
